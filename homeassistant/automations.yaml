# ==============================================================================
# 7. APPLIANCE WARNINGS / ERRORS (i-DOS & Operational Alerts)
# ==============================================================================
- id: washer_idos_warning
  alias: "Waschmaschine: i-DOS Nachfüll-Warnung"
  description: "Warnt wenn Waschmittel oder Weichspüler fast leer ist"
  trigger:
    - platform: state
      entity_id: sensor.washing_machine_poor_i_dos_1_fill_level
      to: "present"
    - platform: state
      entity_id: sensor.washing_machine_poor_i_dos_2_fill_level
      to: "present"
  action:
    - service: mqtt.publish
      data:
        topic: "awtrix/cmd/notify"
        payload: >-
          {
            "text": "i-DOS LEER",
            "icon": "638",
            "textColor": "#FF3B30",
            "durationMs": 10000
          }
