  description: "Zeigt Fortschritt während des Trocknens an"
  trigger:
    - platform: state
      entity_id: sensor.dryer_program_progress
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state.state not in ['unknown', 'unavailable', 'None', ''] 
           and trigger.to_state.state | int(0) > 0 
           and trigger.to_state.state | int(0) < 100 }}
  action:
    - variables:
        pct: "{{ trigger.to_state.state | int(0) }}"
    - service: mqtt.publish
      data:
        topic: "awtrix/cmd/apps/pushed/dryer"
        payload: >-
          {
            "text": "TROCKNET {{ pct }}%",
            "icon": "2062",
            "textColor": "#FFA500",
            "lifetimeMs": 3600000
          }

