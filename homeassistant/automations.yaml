# Home Assistant Automations for Ulanzi TC001 (AWTRIX NG v1 API) & Home Connect Appliances

# ==============================================================================
# 1. WASHING MACHINE: Dynamic Phase & Progress Rotation App
# ==============================================================================
- id: washing_machine_active_progress
  alias: "Waschmaschine: Live-Fortschritt & Phase auf Ulanzi"
  description: "Aktualisiert das AWTRIX NG Display während des Waschgangs mit Phasen-Icons (Waschen, Spülen, Schleudern)"
  trigger:
    - platform: state
      entity_id: sensor.washing_machine_program_progress
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state.state not in ['unknown', 'unavailable', 'None', ''] 
           and trigger.to_state.state | int(0) > 0 
           and trigger.to_state.state | int(0) < 100 }}
  action:
    - variables:
        pct: "{{ trigger.to_state.state | int(0) }}"
        phase_icon: >-
          {% if pct < 70 %}
            waschmaschine_waschen
          {% elif pct < 90 %}
            waschmaschine_spuehlen
          {% else %}
            waschmaschine_schleudern
          {% endif %}
        phase_text: >-
          {% if pct < 70 %}
            WÄSCHT {{ pct }}%
          {% elif pct < 90 %}
            SPÜLT {{ pct }}%
          {% else %}
            SCHLEUDERT {{ pct }}%
          {% endif %}
    - service: mqtt.publish
      data:
        topic: "awtrix/cmd/apps/pushed/washer"
        payload: >-
          {
            "text": "{{ phase_text }}",
            "icon": "{{ phase_icon }}",
            "textColor": "#64C8FF",
            "lifetimeMs": 3600000
          }

# ==============================================================================
# 2. WASHING MACHINE: Finished Alert & Persistent Reminder
# ==============================================================================
- id: washing_machine_finished_notification
  alias: "Waschmaschine: Fertig Benachrichtigung & Erinnerung"
  description: "Sofortige Pop-up Meldung mit Chime und persistente Bildschirmschleife wenn Wäsche fertig ist"
  trigger:
    - platform: numeric_state
      entity_id: sensor.washing_machine_program_progress
      above: 99
    - platform: state
      entity_id: sensor.washing_machine_program_finished
      to: "present"
    - platform: state
      entity_id: sensor.washing_machine_operation_state
      to: "finished"
  action:
    # 2a. Sofortige Pop-up Benachrichtigung (mit Audio-Chime tagsüber)
    - choose:
        - conditions:
            - condition: time
              after: "08:00:00"
              before: "22:00:00"
          sequence:
            - service: mqtt.publish
              data:
                topic: "awtrix/cmd/notify"
                payload: >-
                  {
                    "text": "WÄSCHE FERTIG",
                    "icon": "waschmaschine_fertig",
                    "textColor": "#00FF80",
                    "durationMs": 15000,
                    "sound": {
                      "rtttl": "bell:d=4,o=5,b=100:e,c"
                    }
                  }
      default:
        - service: mqtt.publish
          data:
            topic: "awtrix/cmd/notify"
            payload: >-
              {
                "text": "WÄSCHE FERTIG",
                "icon": "waschmaschine_fertig",
                "textColor": "#00FF80",
                "durationMs": 15000
              }
    # 2b. Persistenter Erinnerungs-Bildschirm im Rotationszyklus (bis Tür geöffnet wird oder max 6 Std.)
    - service: mqtt.publish
      data:
        topic: "awtrix/cmd/apps/pushed/washer"
        payload: >-
          {
            "text": "WÄSCHE FERTIG",
            "icon": "waschmaschine_fertig",
            "textColor": "#00FF80",
            "lifetimeMs": 21600000
          }

# ==============================================================================
# 3. WASHING MACHINE: Dismiss / Clear Screen
# ==============================================================================
- id: washing_machine_dismiss_reminder
  alias: "Waschmaschine: Erinnerung löschen bei Türöffnung oder Taste"
  description: "Löscht den Waschmaschinen-Bildschirm wenn Tür geöffnet oder Select-Taste gedrückt"
  trigger:
    - platform: state
      entity_id: binary_sensor.washing_machine_door
      to: "on"
    - platform: state
      entity_id: binary_sensor.awtrix_ng_button_select
      to: "on"
  action:
    - service: mqtt.publish
      data:
        topic: "awtrix/cmd/apps/pushed/washer"
        payload: "{}"

# ==============================================================================
# 4. DRYER: Dynamic Progress Rotation App
# ==============================================================================
- id: dryer_active_progress
